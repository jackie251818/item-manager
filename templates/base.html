<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}物品使用登记系统{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">📝 物品使用登记</div>
            <div class="nav-menu">
                <a href="{{ url_for('index') }}" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">首页</a>
                <a href="{{ url_for('persons') }}" class="nav-item {% if request.endpoint == 'persons' %}active{% endif %}">人员管理</a>
                <a href="{{ url_for('items') }}" class="nav-item {% if request.endpoint == 'items' %}active{% endif %}">物品管理</a>
                <a href="{{ url_for('records') }}" class="nav-item {% if request.endpoint == 'records' %}active{% endif %}">借用记录</a>
                <div class="nav-user">
                    <span>👤 {{ session.username }}</span>
                    <a href="{{ url_for('logout') }}" class="btn-logout">退出</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
    // ===== CSRF 自动注入 =====
    (function() {
        var token = document.querySelector('meta[name="csrf-token"]');
        if (!token) return;
        var t = token.content;
        // 所有 form 自动加 hidden field
        document.querySelectorAll('form[method="POST"], form[method="post"]').forEach(function(f) {
            if (!f.querySelector('input[name="csrf_token"]')) {
                var h = document.createElement('input');
                h.type = 'hidden'; h.name = 'csrf_token'; h.value = t;
                f.appendChild(h);
            }
        });
        // fetch 自动加 header + body
        var _fetch = window.fetch;
        window.fetch = function(url, opts) {
            opts = opts || {};
            opts.headers = opts.headers || {};
            if (typeof opts.headers === 'object') {
                opts.headers['X-CSRF-Token'] = t;
            }
            // JSON body 也要加 token
            if (opts.body && typeof opts.body === 'string' && opts.body.startsWith('{')) {
                try {
                    var j = JSON.parse(opts.body);
                    j.csrf_token = t;
                    opts.body = JSON.stringify(j);
                } catch(e) {}
            }
            return _fetch.call(this, url, opts);
        };
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
